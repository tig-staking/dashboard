name: Sync Blockchain Data

on:
  schedule:
    
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: tig-data-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync Data
        run: npm run sync

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json holders.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: aktualizacja bazy danych" && git push)
