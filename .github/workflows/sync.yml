name: Sync Blockchain Data

on:
  schedule:
    
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: tig-data-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Sync staking snapshot
        id: staking
        timeout-minutes: 15
        run: node sync.js

      - name: Sync holders snapshot
        if: success()
        timeout-minutes: 8
        run: node holders.js

      - name: Commit & Push changes
        if: ${{ !cancelled() && steps.staking.outcome != 'skipped' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json holders.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: aktualizacja bazy danych" && git push)
