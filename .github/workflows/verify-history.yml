name: Verify Full Staking History

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: staking-history-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Find previous checkpoint on this branch
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const runs = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'verify-history.yml', branch, per_page: 15 });
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId || run.status !== 'completed') continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: run.id });
              if (artifacts.data.artifacts.some(a => a.name === 'staking-history-checkpoint' && !a.expired)) {
                core.setOutput('run', String(run.id)); break;
              }
            }
      - name: Restore verified progress
        if: steps.previous.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: staking-history-checkpoint
          path: .history
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.previous.outputs.run }}
      - name: Rebuild historical events
        run: node verify-history.js
        env:
          HISTORY_RPC_URL: ${{ secrets.HISTORY_RPC_URL }}
      - name: Save checkpoint and verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staking-history-checkpoint
          path: .history/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
