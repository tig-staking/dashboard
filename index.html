<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIG Staking Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --panel-border: #1f293d;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: rgba(99, 102, 241, 0.15);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --green: #10b981;
      --red: #ef4444;
      --card-bg: #1a2234;
      --card-border: #26334d;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --panel: #ffffff;
      --panel-border: #e2e8f0;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-light: rgba(79, 70, 229, 0.1);
      --text: #0f172a;
      --text-muted: #64748b;
      --green: #059669;
      --red: #dc2626;
      --card-bg: #f1f5f9;
      --card-border: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.025em; }
    .brand-badge {
      background: var(--accent-light);
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-green { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .dot-red { background: var(--red); box-shadow: 0 0 8px var(--red); }
    .dot-yellow { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text);
    }
    .btn-secondary:hover { background: var(--accent-light); }

    main {
      flex: 1;
      padding: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .metric-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .metric-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .metric-value { font-size: 1.5rem; font-weight: 800; font-family: var(--font-mono); }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 1.5rem;
    }

    .chart-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 1.25rem;
      height: 350px;
      position: relative;
    }

    .table-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 1.25rem;
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
    th { padding: 0.75rem 1rem; color: var(--text-muted); border-bottom: 1px solid var(--panel-border); font-weight: 700; }
    td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--panel-border); font-family: var(--font-mono); }
    tr:hover { background: var(--accent-light); }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-box {
      background: var(--bg);
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      width: 300px;
      font-size: 0.85rem;
    }

    #appContent { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="dot dot-yellow" id="statusDot"></span>
      <h1>TIG Staking Dashboard</h1>
      <span class="brand-badge" id="syncModeBadge">Syncing</span>
    </div>

    <div class="status-bar">
      <span id="syncStatus">Initializing...</span>
      <button class="btn btn-secondary" id="syncBtn" onclick="fastSync()">Sync Now</button>
      <button class="btn btn-secondary" onclick="toggleTheme()">🌓</button>
    </div>
  </header>

  <main>
    <div id="appContent">
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-title">Total Staked</div>
          <div class="metric-value" id="totalStakedMetric">0</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Total Unstaked</div>
          <div class="metric-value" id="totalUnstakedMetric">0</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Active Stakers</div>
          <div class="metric-value" id="activeStakersMetric">0</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Total Transactions</div>
          <div class="metric-value" id="totalTxsMetric">0</div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-card">
          <canvas id="stakingChart"></canvas>
        </div>
        <div class="chart-card">
          <canvas id="topStakersChart"></canvas>
        </div>
      </div>

      <div class="table-card">
        <div class="controls-bar" style="margin-bottom: 1rem;">
          <h3>Recent Transactions</h3>
          <input type="text" id="searchInput" class="search-box" placeholder="Search address or tx hash..." oninput="filterTable()">
        </div>
        <table>
          <thead>
            <tr>
              <th>Type</th>
              <th>Address</th>
              <th>Amount (TIG)</th>
              <th>Block</th>
              <th>Tx Hash</th>
            </tr>
          </thead>
          <tbody id="txTableBody">
            <!-- Transactions populated dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const C = {
      RPC: 'https://mainnet.base.org',
      CONTRACT: '0x16340277fdd1C93f0b2fD276DCBDD8b093498FE9',
      START_BLOCK: 18000000,
      BATCH: 2000,
      INTERVAL: 60000
    };

    let dbInstance = null;
    let syncing = false;
    let allTransactions = [];

    const db = {
      async open() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open('TIGStakingDB', 1);
          request.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains('txs')) {
              const store = d.createObjectStore('txs', { keyPath: 'id' });
              store.createIndex('blockNumber', 'blockNumber', { unique: false });
            }
            if (!d.objectStoreNames.contains('meta')) {
              d.createObjectStore('meta');
            }
          };
          request.onsuccess = (e) => {
            dbInstance = e.target.result;
            resolve();
          };
          request.onerror = (e) => reject(e.target.error);
        });
      },
      async add(items) {
        return new Promise((resolve, reject) => {
          if (!items || items.length === 0) return resolve();
          const tx = dbInstance.transaction(['txs'], 'readwrite');
          const store = tx.objectStore('txs');
          for (let i = 0; i < items.length; i++) {
            store.put(items[i]);
          }
          tx.oncomplete = () => resolve();
          tx.onerror = (e) => reject(e.target.error);
        });
      },
      async getAll() {
        return new Promise((resolve, reject) => {
          const tx = dbInstance.transaction(['txs'], 'readonly');
          const store = tx.objectStore('txs');
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result);
          req.onerror = (e) => reject(e.target.error);
        });
      },
      async count() {
        return new Promise((resolve, reject) => {
          const tx = dbInstance.transaction(['txs'], 'readonly');
          const store = tx.objectStore('txs');
          const req = store.count();
          req.onsuccess = () => resolve(req.result);
          req.onerror = (e) => reject(e.target.error);
        });
      },
      async meta(key) {
        return new Promise((resolve, reject) => {
          const tx = dbInstance.transaction(['meta'], 'readonly');
          const store = tx.objectStore('meta');
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = (e) => reject(e.target.error);
        });
      },
      async setMeta(key, val) {
        return new Promise((resolve, reject) => {
          const tx = dbInstance.transaction(['meta'], 'readwrite');
          const store = tx.objectStore('meta');
          const req = store.put(val, key);
          req.onsuccess = () => resolve();
          req.onerror = (e) => reject(e.target.error);
        });
      }
    };

    function setDot(cls) {
      document.getElementById('statusDot').className = 'dot ' + cls;
    }

    function setAppVisibility(visible) {
      document.getElementById('appContent').style.display = visible ? 'block' : 'none';
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const target = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', target);
      localStorage.setItem('tig-theme', target);
    }

    async function autoPreload() {
      try {
        const res = await fetch('./data.json');
        if (!res.ok) return;
        const serverData = await res.json();
        
        const localLastBlock = (await db.meta('lastBlock')) || 0;
        const serverLastBlock = (serverData.metadata && serverData.metadata.lastBlock) || 0;

        if (serverLastBlock > localLastBlock) {
          document.getElementById('syncStatus').textContent = 'Loading snapshot from server...';
          const txs = serverData.transactions || [];
          await db.add(txs);

          if (serverData.metadata.lastBlock != null) await db.setMeta('lastBlock', serverData.metadata.lastBlock);
          if (serverData.metadata.lastSync != null) await db.setMeta('lastSync', serverData.metadata.lastSync);
        }
      } catch (e) {
        console.warn('AutoPreload:', e);
      }
    }

    async function fastSync() {
      if (syncing) return;
      syncing = true;
      setDot('dot-yellow');
      document.getElementById('syncStatus').textContent = 'Syncing recent blocks...';

      try {
        const provider = new ethers.providers.JsonRpcProvider(C.RPC);
        const currentBlock = await provider.getBlockNumber();
        let lastBlock = (await db.meta('lastBlock')) || C.START_BLOCK;

        if (lastBlock < currentBlock) {
          const iface = new ethers.utils.Interface([
            "event Staked(address indexed user, uint256 amount)",
            "event Unstaked(address indexed user, uint256 amount)"
          ]);

          const logs = await provider.getLogs({
            address: C.CONTRACT,
            fromBlock: lastBlock + 1,
            toBlock: currentBlock
          });

          const parsed = logs.map(l => {
            let logData = null;
            try { logData = iface.parseLog(l); } catch (e) { return null; }
            return {
              id: l.transactionHash + '-' + l.logIndex,
              type: logData.name,
              user: logData.args.user,
              amount: ethers.utils.formatEther(logData.args.amount),
              blockNumber: l.blockNumber,
              txHash: l.transactionHash
            };
          }).filter(Boolean);

          if (parsed.length > 0) {
            await db.add(parsed);
          }
          await db.setMeta('lastBlock', currentBlock);
          await db.setMeta('lastSync', Date.now());
        }

        const count = await db.count();
        document.getElementById('syncStatus').textContent = 'Synced (' + count.toLocaleString() + ' txs)';
        document.getElementById('syncModeBadge').textContent = 'Live';
        setDot('dot-green');
        setAppVisibility(true);
        await refreshAll();

      } catch (err) {
        console.error(err);
        document.getElementById('syncStatus').textContent = 'Sync Error';
        setDot('dot-red');
      } finally {
        syncing = false;
      }
    }

    async function refreshAll() {
      allTransactions = await db.getAll();
      allTransactions.sort((a, b) => b.blockNumber - a.blockNumber);

      let totalStaked = 0;
      let totalUnstaked = 0;
      const stakersMap = {};

      allTransactions.forEach(tx => {
        const amt = parseFloat(tx.amount);
        if (tx.type === 'Staked') {
          totalStaked += amt;
          stakersMap[tx.user] = (stakersMap[tx.user] || 0) + amt;
        } else if (tx.type === 'Unstaked') {
          totalUnstaked += amt;
          stakersMap[tx.user] = (stakersMap[tx.user] || 0) - amt;
        }
      });

      let activeStakers = 0;
      Object.values(stakersMap).forEach(v => { if (v > 0.001) activeStakers++; });

      document.getElementById('totalStakedMetric').textContent = Math.round(totalStaked).toLocaleString() + ' TIG';
      document.getElementById('totalUnstakedMetric').textContent = Math.round(totalUnstaked).toLocaleString() + ' TIG';
      document.getElementById('activeStakersMetric').textContent = activeStakers.toLocaleString();
      document.getElementById('totalTxsMetric').textContent = allTransactions.length.toLocaleString();

      renderTable(allTransactions.slice(0, 50));
    }

    function renderTable(txs) {
      const tbody = document.getElementById('txTableBody');
      tbody.innerHTML = '';
      txs.forEach(tx => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span style="color: ${tx.type === 'Staked' ? 'var(--green)' : 'var(--red)'}">${tx.type}</span></td>
          <td>${tx.user.substring(0, 6)}...${tx.user.substring(38)}</td>
          <td>${parseFloat(tx.amount).toFixed(2)}</td>
          <td>${tx.blockNumber}</td>
          <td><a href="https://basescan.org/tx/${tx.txHash}" target="_blank" style="color: var(--accent); text-decoration: none;">View</a></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allTransactions.filter(tx => 
        tx.user.toLowerCase().includes(query) || tx.txHash.toLowerCase().includes(query)
      );
      renderTable(filtered.slice(0, 50));
    }

    async function init() {
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('tig-theme') || 'dark');
      } catch (e) {}

      if (typeof ethers === 'undefined') {
        document.getElementById('syncStatus').textContent = 'Failed to load ethers.js';
        setDot('dot-red');
        return;
      }

      try {
        await db.open();
        await autoPreload();

        const c = await db.count();
        if (c > 0) {
          document.getElementById('syncStatus').textContent = 'Loaded ' + c.toLocaleString() + ' txs';
          document.getElementById('syncModeBadge').textContent = 'Loaded';
          setDot('dot-green');
          setAppVisibility(true);
          await refreshAll();
        }

        fastSync();
      } catch (err) {
        console.error(err);
        document.getElementById('syncStatus').textContent = 'DB error';
        setDot('dot-red');
      }

      setInterval(() => {
        if (!syncing) fastSync();
      }, C.INTERVAL);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
